services:
  db:
    build:
      context: ./mocks/database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mentoring}
      POSTGRES_USER: ${POSTGRES_USER:-workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - mentoring-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  auth:
    build:
      context: ./mocks/auth
    environment:
      PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  knowledge:
    build:
      context: ./mocks/knowledge
    environment:
      PORT: 3002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./app/api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-workshop}:${POSTGRES_PASSWORD:-local-demo-only-change-me}@db:5432/${POSTGRES_DB:-mentoring}
      AUTH_URL: http://auth:3001
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    build:
      context: ./app/web
    environment:
      API_HOST: api:3000
      AUTH_HOST: auth:3001
      KNOWLEDGE_HOST: knowledge:3002
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      auth:
        condition: service_healthy

volumes:
  mentoring-data:
