server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://${API_HOST}/;
    }

    location /auth/ {
        proxy_pass http://${AUTH_HOST}/;
    }

    location /knowledge/ {
        proxy_pass http://${KNOWLEDGE_HOST}/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
